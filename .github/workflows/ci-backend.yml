name: CI - Backend

on:
  pull_request:
    paths:
      - 'mari-puntos-backend/**'
      - '.github/workflows/ci-backend.yml'

defaults:
  run:
    working-directory: mari-puntos-backend

jobs:
  lint-typecheck-build:
    name: Lint, TypeCheck & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: mari-puntos-backend/node_modules
          key: ${{ runner.os }}-pnpm-backend-${{ hashFiles('mari-puntos-backend/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-backend-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: TypeCheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build
