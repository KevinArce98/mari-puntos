name: Auto Changeset

on:
  push:
    branches:
      - staging
    paths:
      - 'mari-puntos-app/**'
      - 'mari-puntos-backend/**'

permissions:
  contents: write

jobs:
  auto-changeset:
    name: Generate Changeset
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install root dependencies
        run: npm install

      - name: Generate changeset from conventional commits
        id: generate
        run: |
          set -e

          MERGE_BASE=$(git merge-base HEAD origin/main 2>/dev/null || git rev-list --max-parents=0 HEAD)
          COMMITS=$(git log --pretty=format:"%s" "$MERGE_BASE"..HEAD)

          if [ -z "$COMMITS" ]; then
            echo "No commits found since merge base."
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Skip if changeset already added in this branch
          EXISTING=$(git diff --name-only "$MERGE_BASE"..HEAD -- '.changeset/*.md' | grep -v 'README.md' || true)
          if [ -n "$EXISTING" ]; then
            echo "Changeset already exists in branch. Skipping."
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Detect which packages actually have file changes
          CHANGED_FILES=$(git diff --name-only "$MERGE_BASE"..HEAD)
          APP_HAS_CHANGES=$(echo "$CHANGED_FILES" | grep -q "^mari-puntos-app/" && echo "true" || echo "false")
          BACKEND_HAS_CHANGES=$(echo "$CHANGED_FILES" | grep -q "^mari-puntos-backend/" && echo "true" || echo "false")

          if [ "$APP_HAS_CHANGES" = "false" ] && [ "$BACKEND_HAS_CHANGES" = "false" ]; then
            echo "No file changes detected in app or backend packages. Skipping."
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Changed packages — app: $APP_HAS_CHANGES, backend: $BACKEND_HAS_CHANGES"

          declare -A PACKAGE_BUMP

          bump_priority() {
            case $1 in major) echo 3 ;; minor) echo 2 ;; patch) echo 1 ;; *) echo 0 ;; esac
          }

          higher_bump() {
            if [ "$(bump_priority "$1")" -gt "$(bump_priority "$2")" ]; then echo "$1"; else echo "$2"; fi
          }

          while IFS= read -r commit; do
            [ -z "$commit" ] && continue

            if [[ $commit =~ ^([a-z]+)(\(([a-zA-Z,]+)\))?(!)?: ]]; then
              TYPE="${BASH_REMATCH[1]}"
              SCOPE="${BASH_REMATCH[3]}"
              BREAKING="${BASH_REMATCH[4]}"

              # Skip non-release commit types unless breaking
              if [[ "$TYPE" =~ ^(chore|ci|docs|test|style|build)$ ]] && [ -z "$BREAKING" ]; then
                continue
              fi

              if [ -n "$BREAKING" ]; then
                BUMP="major"
              elif [ "$TYPE" = "feat" ]; then
                BUMP="minor"
              else
                BUMP="patch"
              fi

              if [ -z "$SCOPE" ]; then
                SCOPES=("app" "backend")
              else
                IFS=',' read -ra SCOPES <<< "$SCOPE"
              fi

              for s in "${SCOPES[@]}"; do
                case $s in
                  app)     PKG="mari-puntos-app" ;;
                  backend) PKG="mari-puntos-backend" ;;
                  # website is ignored in .changeset/config.json — skip
                  *)       continue ;;
                esac

                # Only bump packages with actual file changes
                if [ "$PKG" = "mari-puntos-app" ] && [ "$APP_HAS_CHANGES" = "false" ]; then continue; fi
                if [ "$PKG" = "mari-puntos-backend" ] && [ "$BACKEND_HAS_CHANGES" = "false" ]; then continue; fi

                CURRENT="${PACKAGE_BUMP[$PKG]:-}"
                PACKAGE_BUMP[$PKG]=$(higher_bump "$BUMP" "$CURRENT")
              done
            fi
          done <<< "$COMMITS"

          if [ ${#PACKAGE_BUMP[@]} -eq 0 ]; then
            echo "No releasable commits found. Skipping."
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CHANGESET_ID=$(node -e "console.log(require('crypto').randomBytes(8).toString('hex'))")
          CHANGESET_FILE=".changeset/auto-${CHANGESET_ID}.md"

          {
            echo "---"
            for PKG in "${!PACKAGE_BUMP[@]}"; do
              echo "\"$PKG\": ${PACKAGE_BUMP[$PKG]}"
            done
            echo "---"
            echo ""
            echo "Auto-generated changeset from staging commits."
          } > "$CHANGESET_FILE"

          echo "Created: $CHANGESET_FILE"
          cat "$CHANGESET_FILE"
          echo "created=true" >> "$GITHUB_OUTPUT"

      - name: Commit and push changeset
        if: steps.generate.outputs.created == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .changeset/
          git commit -m "chore(repo): add auto-generated changeset [skip ci]"
          git push
